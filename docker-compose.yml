version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: veloxa-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: M4uropava
      MYSQL_DATABASE: veloxa_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Opcional: Descomenta la siguiente línea para que el script se ejecute automáticamente al iniciar el contenedor
      # - ./databaseMySQL.sql:/docker-entrypoint-initdb.d/setup.sql

volumes:
  mysql_data:
